# Pipeline de calidad de BiblioTech.
# Se ejecuta en cada push y pull request.
# Puertas de calidad: pruebas unitarias, linter (Flake8), análisis de seguridad (Bandit) y dependencias (pip-audit).
name: Calidad BiblioTech

on: [push, pull_request]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas unitarias
        run: python -m pytest -v

      - name: Linter y estilo (Flake8)
        run: python -m flake8 --count

      - name: Análisis de seguridad (Bandit)
        run: python -m bandit -r bibliotech

      - name: Auditoría de dependencias (pip-audit)
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
